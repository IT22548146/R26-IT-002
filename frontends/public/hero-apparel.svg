<svg viewBox="0 0 720 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Garment apparel illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shirtLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="swatch1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="swatch2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="720" height="620" rx="36" fill="url(#bg)"/>
  <circle cx="120" cy="110" r="70" fill="#c7d2fe" opacity="0.5"/>
  <circle cx="620" cy="520" r="90" fill="#bae6fd" opacity="0.45"/>

  <!-- hanger -->
  <g stroke="#94a3b8" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M360 96 q0 -30 26 -30 q22 0 22 20"/>
    <path d="M360 96 L250 178"/>
    <path d="M360 96 L470 178"/>
    <path d="M250 178 L470 178" opacity="0"/>
  </g>
  <circle cx="360" cy="96" r="7" fill="#64748b"/>

  <!-- main garment (dress/shirt) -->
  <g filter="url(#soft)">
    <path d="M258 170
             C300 150 420 150 462 170
             C452 210 452 214 470 250
             C440 262 430 268 430 290
             L430 470
             C430 486 418 498 402 498
             L318 498
             C302 498 290 486 290 470
             L290 290
             C290 268 280 262 250 250
             C268 214 268 210 258 170 Z"
          fill="url(#shirt)"/>
    <!-- collar -->
    <path d="M330 168 q30 44 60 0 l-8 -6 q-22 30 -44 0 Z" fill="#0b1220"/>
    <!-- fabric fold highlights -->
    <path d="M348 300 C352 360 352 420 346 480" stroke="#334155" stroke-width="5" fill="none" opacity="0.7"/>
    <path d="M392 300 C388 360 388 420 394 480" stroke="#334155" stroke-width="5" fill="none" opacity="0.7"/>
    <!-- stitched pocket accent -->
    <rect x="352" y="330" width="36" height="30" rx="5" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6 5"/>
  </g>

  <!-- floating fabric swatches -->
  <g filter="url(#soft)">
    <rect x="70" y="330" width="120" height="150" rx="20" fill="url(#swatch1)" transform="rotate(-12 130 405)"/>
    <rect x="86" y="352" width="88" height="10" rx="5" fill="#ffffff" opacity="0.25" transform="rotate(-12 130 405)"/>
    <rect x="86" y="372" width="60" height="10" rx="5" fill="#ffffff" opacity="0.25" transform="rotate(-12 130 405)"/>
  </g>
  <g filter="url(#soft)">
    <rect x="540" y="120" width="120" height="150" rx="20" fill="url(#swatch2)" transform="rotate(10 600 195)"/>
    <path d="M556 150 q30 24 60 0" stroke="#ffffff" stroke-width="6" fill="none" opacity="0.4" transform="rotate(10 600 195)"/>
    <path d="M556 178 q30 24 60 0" stroke="#ffffff" stroke-width="6" fill="none" opacity="0.4" transform="rotate(10 600 195)"/>
  </g>

  <!-- thread spool -->
  <g filter="url(#soft)" transform="translate(560 400)">
    <rect x="0" y="0" width="70" height="96" rx="14" fill="url(#thread)"/>
    <rect x="0" y="18" width="70" height="60" fill="#93c5fd"/>
    <path d="M6 24 h58 M6 36 h58 M6 48 h58 M6 60 h58 M6 72 h58" stroke="#1d4ed8" stroke-width="3" opacity="0.55"/>
    <circle cx="35" cy="9" r="4" fill="#64748b"/>
    <circle cx="35" cy="87" r="4" fill="#64748b"/>
  </g>

  <!-- needle + stitch line -->
  <path d="M110 560 C220 540 300 560 430 540" stroke="#3b82f6" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round" fill="none"/>
  <g transform="rotate(28 470 528)">
    <rect x="452" y="520" width="70" height="6" rx="3" fill="#cbd5e1"/>
    <circle cx="452" cy="523" r="6" fill="#94a3b8"/>
    <line x1="450" y1="521" x2="450" y2="525" stroke="#334155" stroke-width="2"/>
  </g>
</svg>
