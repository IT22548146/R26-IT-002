[project]
name = "fabricflow"
version = "1.0.0"
description = "Integrated garment production planning, monitoring, and analytics platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "flask==3.1.3",
    "flask-cors==6.0.2",
    "joblib==1.5.3",
    "numpy==2.4.4",
    "openpyxl==3.1.5",
    "pandas==3.0.2",
    "python-dotenv==1.2.2",
    "scikit-learn==1.8.0",
    "xgboost==3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff>=0.11,<1",
]
report = [
    "matplotlib>=3.9,<4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["Build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
